name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-package:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Build, test, bundle Chromium, and create MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -Version "1.0.${{ github.run_number }}"
      - name: Upload unsigned MSI and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RockcliffeCourtBooker-win-x64-msi
          path: |
            artifacts/installer/**/*.msi
            artifacts/installer/**/*.msi.sha256
          if-no-files-found: error
          retention-days: 14
